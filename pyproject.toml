[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-terrain"
version = "0.1.0"
description = "Digest a 47-class Smart Terrain segmentation raster into LLM-readable representations"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=10.0",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3"]
# `segmap ask` drives the SDK's beta tool runner and hands beta_tool an explicit
# input_schema; both are recent.
llm = ["anthropic>=0.116"]
# `segmap segment` runs the Smart Terrain ONNX models. The weights themselves are
# half a gigabyte each and are not shipped: they live in ./models (or
# $SEGMAP_ST_MODELS). Everything else in the CLI runs without this.
st = ["onnxruntime>=1.16", "rasterio>=1.3"]
dev = ["pytest>=7"]

[project.scripts]
segmap = "segmap_digest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"segmap_digest.data" = ["*.json", "*.md"]

[tool.pytest.ini_options]
markers = [
    "slow: touches the half-gigabyte ONNX weights or real imagery; skips when absent",
]
