[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "segmap-digest-poc"
version = "0.1.0"
description = "Digest a 45-class Smart Terrain segmentation raster into LLM-readable representations"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=10.0",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3"]
llm = ["anthropic>=0.60"]
dev = ["pytest>=7"]

[project.scripts]
segmap = "segmap_digest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
